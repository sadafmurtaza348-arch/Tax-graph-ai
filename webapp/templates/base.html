<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Tax Compliance Dashboard{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
    :root {
        --bg: #0f1117;
        --panel: #171a23;
        --border: #262b38;
        --text: #e8eaf0;
        --muted: #8b91a3;
        --accent: #5b8cff;
        --red: #ff5c5c;
        --orange: #ffa557;
        --green: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
    }
    a { color: inherit; text-decoration: none; }

    nav {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 16px 32px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 10;
    }
    nav .brand { font-weight: 700; font-size: 15px; margin-right: 12px; }
    nav a.nav-link {
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        padding: 6px 4px;
        border-bottom: 2px solid transparent;
    }
    nav a.nav-link:hover, nav a.nav-link.active {
        color: var(--text);
        border-bottom: 2px solid var(--accent);
    }
    nav .nav-search {
        margin-left: auto;
        position: relative;
        width: 260px;
    }
    nav .nav-search input {
        width: 100%;
        padding: 8px 12px;
        background: #0f1117;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
    }
    #navSearchResults {
        position: absolute;
        top: 38px;
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        max-height: 300px;
        overflow-y: auto;
        display: none;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #navSearchResults a {
        display: block;
        padding: 10px 12px;
        font-size: 13px;
        border-bottom: 1px solid var(--border);
    }
    #navSearchResults a:hover { background: #1c202c; }
    #navSearchResults .r-name { font-weight: 600; }
    #navSearchResults .r-score { float: right; color: var(--muted); }

    main { padding: 28px 32px; max-width: 1200px; margin: 0 auto; }

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 28px;
    }
    .stat-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
    }
    .stat-card .value { font-size: 26px; font-weight: 700; }
    .stat-card .label { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
    }
    .panel h2 { font-size: 15px; margin: 0 0 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
        text-align: left;
        padding: 10px 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr.clickable-row { cursor: pointer; }
    tr.clickable-row:hover td { background: #1c202c; }

    .score-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 12px;
    }
    .score-high { background: rgba(255,92,92,0.15); color: var(--red); }
    .score-mid { background: rgba(255,165,87,0.15); color: var(--orange); }
    .score-low { background: rgba(74,222,128,0.15); color: var(--green); }

    .reason { color: var(--muted); font-size: 12px; }
    .cnic { color: var(--muted); font-size: 12px; }

    input#pageSearch {
        width: 100%;
        padding: 10px 12px;
        background: #0f1117;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
        margin-bottom: 14px;
    }

    .btn {
        display: inline-block;
        padding: 8px 16px;
        background: var(--accent);
        color: white;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        border: none;
        cursor: pointer;
    }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
    }
    .detail-item { background: #0f1117; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .detail-item .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .detail-item .v { font-size: 16px; font-weight: 600; }

    .reasons-list { list-style: none; padding: 0; margin: 0; }
    .reasons-list li {
        padding: 12px 14px;
        background: rgba(255,165,87,0.08);
        border-left: 3px solid var(--orange);
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 13px;
    }
    .no-reasons { color: var(--green); font-size: 13px; }

    .back-link { color: var(--accent); font-size: 13px; margin-bottom: 16px; display: inline-block; }

    .nav-cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
    .nav-card {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 22px;
        transition: border-color 0.15s, background 0.15s;
    }
    .nav-card:hover { border-color: var(--accent); background: #1c202c; }
    .nav-card-icon { font-size: 28px; line-height: 1; }
    .nav-card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .nav-card-desc { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .nav-card-arrow { margin-left: auto; color: var(--muted); font-size: 20px; }

    @media (max-width: 700px) {
        .nav-cards { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<nav>
    <div class="brand">🔍 Tax Graph AI</div>
    <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="/">Dashboard</a>
    <a class="nav-link {% block nav_people %}{% endblock %}" href="/people">All People</a>
    <a class="nav-link {% block nav_guide %}{% endblock %}" href="/guide">Guide</a>
    <div class="nav-search">
        <input type="text" id="navSearchInput" placeholder="Search name or CNIC...">
        <div id="navSearchResults"></div>
    </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<script>
// live search in nav bar, available on every page
const navInput = document.getElementById('navSearchInput');
const navResults = document.getElementById('navSearchResults');

function scoreClass(score) {
    score = parseInt(score);
    if (score >= 70) return 'score-high';
    if (score >= 30) return 'score-mid';
    return 'score-low';
}

let debounceTimer;
navInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = navInput.value.trim();
    if (!q) { navResults.style.display = 'none'; return; }
    debounceTimer = setTimeout(() => {
        fetch(`/api/search?q=${encodeURIComponent(q)}`)
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    navResults.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px;">No matches</div>';
                } else {
                    navResults.innerHTML = data.map(r => `
                        <a href="/person/${r.resolved_id}">
                            <span class="r-name">${r.filer_name}</span>
                            <span class="r-score score-badge ${scoreClass(r.deviation_score)}">${r.deviation_score}</span>
                        </a>
                    `).join('');
                }
                navResults.style.display = 'block';
            });
    }, 200);
});

document.addEventListener('click', (e) => {
    if (!navInput.contains(e.target) && !navResults.contains(e.target)) {
        navResults.style.display = 'none';
    }
});
</script>

{% block scripts %}{% endblock %}

</body>
</html>
